<!doctype html>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>Mini-FT8</title>
<!--
  Entry asset for the installed app (RFC 0004 §11). Three screens behind one
  bottom tab bar: Operate (default) collapses what the ADV's 240x135 splits
  across RX/TX/STATUS; Log browses the day files over the async FILE_LIST/
  FILE_READ relay; Settings is the station-config form this page used to be
  on its own before I28d's screen model landed.

  All three share one /api/events poll (RFC 0004 §6 -- the same polled shape
  as the ADV's own Port A link) and one /api/config fetch. Settings' form
  fields are only ever written by loadConfig() at boot or right after an
  explicit action (save/connect/tune/clock) -- never by the periodic poll,
  which would stomp on an in-progress edit. Operate's live header is the
  opposite: refreshed on every poll tick, never touches the form.
-->
<style>
:root{color-scheme:light dark}
body{font-family:system-ui;margin:0;padding:0 0 3.75rem;line-height:1.35;background:Canvas;color:CanvasText}
h1{font-size:1.15rem;margin:0}
h2{font-size:.95rem;margin:1.1rem 0 .5rem;color:GrayText}
label{display:block;font-size:.8rem;color:GrayText;margin-top:.6rem}
input,select{width:100%;box-sizing:border-box;padding:.45rem;font-size:1rem;margin-top:.15rem;background:Field;color:FieldText}
button{padding:.6rem;font-size:.95rem;background:ButtonFace;color:ButtonText;border:1px solid GrayText;border-radius:.4rem}
button:disabled{opacity:.45}
.wrap{max-width:26rem;margin:0 auto;padding:0 1rem}
#m{color:GrayText;font-size:.85rem;min-height:1.2em;margin:.5rem 0}
.row{display:flex;gap:.5rem}
.row>*{flex:1}
.row button{margin-top:.5rem}
[hidden]{display:none!important}

/* ---- tab bar ---- */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;border-top:1px solid GrayText;background:Canvas}
#tabbar button{flex:1;border:0;border-radius:0;background:transparent;padding:.5rem 0 .6rem;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;color:GrayText}
#tabbar button.on{color:CanvasText;font-weight:700}
#tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- operate: state header ---- */
#opHeader{padding:.75rem 1rem;border-bottom:1px solid color-mix(in srgb, GrayText 30%, transparent)}
#opHeader .top{display:flex;justify-content:space-between;align-items:flex-end}
#countdown{font-family:ui-monospace,monospace;font-size:1.9rem;font-weight:700;line-height:1}
#slotSub{font-size:.7rem;color:GrayText}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:999px}
.pill-parity{background:#dbeafe;color:#1e3a8a}
.pill-beacon-on{background:#dcfce7;color:#14532d}
.pill-beacon-off{background:color-mix(in srgb, GrayText 20%, transparent);color:GrayText}
#opLive{display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;font-size:.75rem;color:GrayText;margin-top:.6rem}
#opBandSel{width:auto;margin-top:0;padding:.25rem .4rem;font-size:.75rem;font-family:ui-monospace,monospace;background:Field;color:FieldText}
#opDots{display:flex;gap:.9rem;margin-top:.6rem;font-size:.7rem;color:GrayText}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:.3rem;background:GrayText}
.dot.up{background:#22c55e}
.dot.bad{background:#ef4444}
#clockDotWrap{cursor:pointer}
#opConnRow button{font-size:.85rem}
#beaconBtn{width:100%;margin-top:.6rem;text-align:left}

/* ---- operate: TX HUD ---- */
#opTxHud{padding:.6rem 1rem;border-bottom:1px solid color-mix(in srgb, GrayText 30%, transparent);background:color-mix(in srgb, #ef4444 8%, transparent)}
#opTxHud .hd{font-size:.7rem;color:#b91c1c;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
#opTxHud.aborted{background:color-mix(in srgb, #f59e0b 14%, transparent)}
#opTxHud.aborted .hd{color:#b45309}
#opTxHudText{font-family:ui-monospace,monospace;font-weight:700;font-size:1rem;margin-top:.2rem;min-height:1.2em}
#opTxHudMeta{font-family:ui-monospace,monospace;font-size:.8rem;color:GrayText;margin-top:.15rem}

/* ---- operate: queue ---- */
#opQueue{border-bottom:1px solid color-mix(in srgb, GrayText 30%, transparent);max-height:11rem;overflow-y:auto}
#opQueue .hd{padding:.6rem 1rem .2rem;font-size:.7rem;color:GrayText;text-transform:uppercase;letter-spacing:.04em}
.qrow{display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem;border-top:1px solid color-mix(in srgb, GrayText 15%, transparent)}
.qrow .call{font-family:ui-monospace,monospace;font-weight:700;flex:1}
.qrow .retry{font-size:.7rem;color:GrayText;display:block}
.qstate{font-size:.65rem;font-weight:700;padding:.15rem .4rem;border-radius:.3rem;white-space:nowrap}
.qs-0{background:#dbeafe;color:#1e3a8a}                    /* CALLING */
.qs-1,.qs-2,.qs-3{background:#fef3c7;color:#78350f}          /* REPLYING/REPORT/ROGER_REPORT */
.qs-4,.qs-5{background:#dcfce7;color:#14532d}                /* ROGERS/SIGNOFF */
.qcancel{background:transparent;border:0;color:GrayText;font-size:1rem;padding:0 .2rem}
#opQueueEmpty{padding:.6rem 1rem;font-size:.8rem;color:GrayText}

/* ---- operate: decode stream ---- */
#opDecodes{padding-bottom:.5rem}
#opDecodes .hd{padding:.6rem 1rem .2rem;font-size:.7rem;color:GrayText;text-transform:uppercase;letter-spacing:.04em}
.drow{padding:.4rem 1rem;border-top:1px solid color-mix(in srgb, GrayText 15%, transparent);cursor:pointer}
.drow .meta{font-family:ui-monospace,monospace;font-size:.7rem;color:GrayText;display:flex;justify-content:space-between}
.drow .txt{font-size:.85rem;margin-top:.1rem}
/* Same precedence as ui.cpp's draw_rx_line(): to_me red, else recent_qso gray,
   else cq green, else default text color. */
.drow .txt.c-me{color:#ff0000;font-weight:700}
.drow .txt.c-recent{color:#787878}
.drow .txt.c-cq{color:#00c800}
.drow .me{font-size:.65rem;font-weight:700;color:#1d4ed8;border:1px solid #93c5fd;border-radius:.3rem;padding:0 .3rem;margin-left:.3rem}
.dslotdiv{border-top:2px dashed color-mix(in srgb, GrayText 45%, transparent);margin:.35rem 1rem}

/* ---- log ---- */
#logList{padding-bottom:.5rem}
.day{padding:.6rem 1rem .2rem;font-size:.75rem;font-weight:700;color:GrayText}
.frow{padding:.5rem 1rem;border-top:1px solid color-mix(in srgb, GrayText 15%, transparent)}
.frow-main{display:flex;justify-content:space-between;align-items:center}
.frow .call{font-family:ui-monospace,monospace;font-weight:700}
.frow .grid{font-size:.65rem;font-weight:700;color:#1d4ed8;border:1px solid #93c5fd;border-radius:.3rem;padding:0 .3rem;margin-left:.3rem}
.frow .sub{font-size:.7rem;color:GrayText;text-align:right}
.frow-extra{margin-top:.25rem;font-size:.7rem;color:GrayText;display:flex;flex-wrap:wrap;gap:.6rem}
.frow-extra .degrid{font-family:ui-monospace,monospace;font-weight:700}
.frow-extra .comment{font-style:italic;overflow-wrap:anywhere}
#logMore{padding:.7rem 1rem;text-align:center;color:GrayText;font-size:.8rem}
</style>

<div class=wrap>
  <h1>Mini-FT8</h1>
  <p id=m>Loading…</p>

  <!-- ================= OPERATE ================= -->
  <section id=view-operate>
    <div id=opHeader>
      <div class=top>
        <div>
          <div id=countdown>—</div>
          <div id=slotSub>—</div>
        </div>
        <span id=parityPill class="pill pill-parity">—</span>
      </div>
      <div id=opDots>
        <span><span id=dotCat class=dot></span>CAT</span>
        <span><span id=dotAudio class=dot></span>Audio</span>
        <span id=clockDotWrap title="Tap to sync now"><span id=dotClock class=dot></span><span id=clockLabel>Clock</span></span>
      </div>
      <div id=opConnRow class=row>
        <button id=opConnect type=button disabled>Connect</button>
        <button id=opTune type=button disabled>Tune: Off</button>
      </div>
      <button id=beaconBtn type=button disabled>Beacon: —</button>
      <div id=opLive><select id=opBandSel disabled></select><span id=opOffset>TX: —</span></div>
    </div>

    <div id=opTxHud hidden>
      <div class=hd>Transmitting</div>
      <div id=opTxHudText></div>
      <div id=opTxHudMeta></div>
    </div>

    <div id=opQueue>
      <div class=hd>Queue</div>
      <div id=opQueueEmpty>No active QSOs</div>
      <div id=opQueueRows></div>
    </div>

    <div id=opDecodes>
      <div class=hd>Decodes &middot; tap to reply</div>
      <div id=opDecodeRows></div>
    </div>
  </section>

  <!-- ================= LOG ================= -->
  <!-- One continuous list spanning every day file (RFC 0004 §11) -- day
       dividers, lazy-loaded older entries, no file picker. loadMoreLog()
       walks logFiles transparently: file boundaries are an implementation
       detail, not something the operator navigates. -->
  <section id=view-log hidden>
    <div id=logList></div>
    <div id=logMore hidden><button id=logMoreBtn type=button>Load older QSOs</button></div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id=view-settings hidden>
    <section>
      <h2>Station</h2>
      <label>Call <input id=call autocomplete=off spellcheck=false></label>
      <label>Grid <input id=grid autocomplete=off spellcheck=false></label>
      <label>CQ type
        <select id=cq_type>
          <option value=0>CQ</option>
          <option value=1>SOTA</option>
          <option value=2>POTA</option>
          <option value=3>QRP</option>
          <option value=4>FD</option>
          <option value=5>FreeText</option>
        </select>
      </label>
      <label>CQ / exchange text <input id=cq_ft autocomplete=off></label>
      <label>Free-text field <input id=free_text autocomplete=off></label>
      <label>Comment <input id=comment1 autocomplete=off></label>
      <label>Ignore prefixes <input id=ignore_prefixes autocomplete=off></label>
    </section>

    <section>
      <h2>Radio</h2>
      <p style="font-size:.8rem;color:GrayText;margin-top:0">Connect, tune and clock sync now live on Operate.</p>
      <div class=row>
        <label>Offset Hz <input id=offset type=number></label>
        <label>Offset src
          <select id=offset_src>
            <option value=0>Random</option>
            <option value=1>RX</option>
            <option value=2>Fixed</option>
          </select>
        </label>
      </div>
      <label>Radio profile (saved int) <input id=radio type=number></label>
      <label>Active bands <input id=active_bands autocomplete=off></label>
      <label>Band <select id=band_sel></select></label>
      <label>Protocol
        <select id=protocol_mode>
          <option value=FT8>FT8</option>
          <option value=FT4>FT4</option>
        </select>
      </label>
      <div class=row>
        <label>Skip TX1
          <select id=skiptx1>
            <option value=0>Off</option>
            <option value=1>On</option>
          </select>
        </label>
        <label>Max retry <input id=autoseq_max_retry type=number min=0></label>
      </div>
      <label>RxTx log
        <select id=rxtx_log>
          <option value=0>Off</option>
          <option value=1>On</option>
        </select>
      </label>
    </section>

    <button id=save type=button disabled style="width:100%">Save station</button>

    <nav style="font-size:.85rem;margin:1rem 0">
      <a href=/log>Raw ADV log</a> ·
      <a href=/update>Install / update</a> ·
      <a href=/>Status</a>
    </nav>
  </section>
</div>

<nav id=tabbar>
  <button type=button data-view=operate class=on>
    <svg viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
    Operate
  </button>
  <button type=button data-view=log>
    <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
    QSOs
  </button>
  <button type=button data-view=settings>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09A1.7 1.7 0 0015 4.6a1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
    Settings
  </button>
</nav>

<script src=/pairing.js></script>
<script>
var m = document.getElementById('m');
// Index order matches ADV g_bands[] (main.cpp). Names are fixed; freqs come from config.
var BANDS = [
  {i: 0, name: '160m', n: 160}, {i: 1, name: '80m', n: 80}, {i: 2, name: '60m', n: 60},
  {i: 3, name: '40m', n: 40}, {i: 4, name: '30m', n: 30}, {i: 5, name: '20m', n: 20},
  {i: 6, name: '17m', n: 17}, {i: 7, name: '15m', n: 15}, {i: 8, name: '12m', n: 12},
  {i: 9, name: '10m', n: 10}, {i: 10, name: '6m', n: 6}, {i: 11, name: '2m', n: 2}
];
var FIELDS = [
  'call','grid','cq_type','cq_ft','free_text','comment1','ignore_prefixes',
  'offset','offset_src','radio','active_bands','band_sel','protocol_mode',
  'skiptx1','autoseq_max_retry','rxtx_log'
];
var CQ_TYPE_NAMES = ['CQ', 'SOTA', 'POTA', 'QRP', 'FD', 'FreeText'];
var BEACON_NAMES = ['Off', 'Even', 'Odd'];
// AutoseqState wire values (main/autoseq.h). 6 = IDLE = remove from display.
var QUEUE_STATE_NAMES = ['CALLING', 'REPLYING', 'REPORT', 'ROGER REPORT', 'ROGERS', 'SIGNOFF'];

function setMsg(t) { m.textContent = t; }

function yn(v) {
  return (v === '1' || v === 1 || v === true || v === 'true') ? 'yes' : 'no';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

// ===================== tabs =====================

var VIEWS = ['operate', 'log', 'settings'];
var currentView = 'operate';

function showView(name) {
  currentView = name;
  VIEWS.forEach(function (v) {
    document.getElementById('view-' + v).hidden = (v !== name);
  });
  document.querySelectorAll('#tabbar button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-view') === name);
  });
  if (name === 'log' && !logLoadedOnce) {
    logLoadedOnce = true;
    document.getElementById('logList').innerHTML = '<p style="padding:0 1rem;color:GrayText">Loading…</p>';
    loadMoreLog();
  }
}
document.querySelectorAll('#tabbar button').forEach(function (b) {
  b.onclick = function () { showView(b.getAttribute('data-view')); };
});

// ===================== config (shared: Operate live header + Settings form) =====================

var lastCfg = {};

function bandFreq(cfg, idx) {
  var k = 'band' + idx;
  var fk = 'ft4_band' + idx;
  if (cfg[k] !== undefined && cfg[k] !== null && cfg[k] !== '') return String(cfg[k]);
  if (cfg[fk] !== undefined && cfg[fk] !== null && cfg[fk] !== '') return String(cfg[fk]);
  return '';
}

// Shared by both band dropdowns (Operate + Settings) -- one function, one
// set of option labels, so they can never drift out of sync with each other.
function fillBandSelect(cfg, sel) {
  var want = {};
  var any = false;
  String(cfg.active_bands || '').split(/[\s,;\/]+/).forEach(function (t) {
    var n = parseInt(t, 10);
    if (n > 0) { want[n] = true; any = true; }
  });
  var rows = [];
  BANDS.forEach(function (b) {
    if (any && !want[b.n]) return;
    var freq = bandFreq(cfg, b.i);
    rows.push({ i: b.i, label: b.name + (freq ? (' · ' + freq + ' kHz') : '') });
  });
  if (!rows.length) {
    BANDS.forEach(function (b) {
      var freq = bandFreq(cfg, b.i);
      rows.push({ i: b.i, label: b.name + (freq ? (' · ' + freq + ' kHz') : '') });
    });
  }
  var cur = String(cfg.band_sel !== undefined && cfg.band_sel !== null ? cfg.band_sel : '');
  sel.innerHTML = '';
  rows.forEach(function (r) {
    var opt = document.createElement('option');
    opt.value = String(r.i);
    opt.textContent = r.label;
    sel.appendChild(opt);
  });
  if (cur !== '') sel.value = cur;
  if (sel.value !== cur && rows.length) sel.selectedIndex = 0;
}

function setForm(cfg) {
  // Rebuilding a <select>'s options while the operator has it open would
  // yank the picker out from under them -- same reason loadConfig() only
  // ever runs at boot or right after an explicit action, never on the
  // periodic poll (see pollLiveStatus()/applyOperateLive() below).
  fillBandSelect(cfg, document.getElementById('band_sel'));
  fillBandSelect(cfg, document.getElementById('opBandSel'));
  FIELDS.forEach(function (k) {
    var el = document.getElementById(k);
    if (!el) return;
    if (k === 'protocol_mode') {
      el.value = (cfg.protocol_mode === 'FT4') ? 'FT4' : 'FT8';
      return;
    }
    if (k === 'band_sel') return; // filled above
    if (cfg[k] === undefined || cfg[k] === null) return;
    el.value = String(cfg[k]);
  });
  if (cfg.band_sel !== undefined && cfg.band_sel !== null) {
    document.getElementById('band_sel').value = String(cfg.band_sel);
    document.getElementById('opBandSel').value = String(cfg.band_sel);
  }
}

function formBody() {
  var lines = [];
  FIELDS.forEach(function (k) {
    var el = document.getElementById(k);
    if (!el) return;
    var v = el.value;
    if (k === 'protocol_mode') {
      lines.push('protocol_mode=' + (v === 'FT4' ? 'FT4' : 'FT8'));
      return;
    }
    lines.push(k + '=' + v);
  });
  return lines.join('\n');
}

// Operate's header: CAT/audio/clock status, Connect/Tune labels, cq_type
// (for the beacon label). Safe to call on every poll tick -- never touches
// Settings' inputs, and never rebuilds #opBandSel's options (that only
// happens in setForm(), same reasoning as the comment there). The band
// dropdown's own closed-state text already shows the selected band's label
// ("20m · 14074 kHz"), so there is no separate band/freq readout to keep
// current here.
function applyOperateLive(cfg) {
  document.getElementById('dotCat').classList.toggle('up', yn(cfg.cat_ready) === 'yes');
  // audio_rx is deliberately stricter than "streaming is engaged" -- the ADV
  // only sends it true when a real USB audio frame arrived in the last
  // couple of seconds, not merely that the pipe is open (see
  // porta_host_config_snapshot() in main.cpp).
  document.getElementById('dotAudio').classList.toggle('up', yn(cfg.audio_rx) === 'yes');

  var clockSet = yn(cfg.clock_set) === 'yes';
  var dotClock = document.getElementById('dotClock');
  dotClock.classList.toggle('up', clockSet);
  dotClock.classList.toggle('bad', !clockSet && !!MiniFT8Pairing.getToken());
  var srcName = cfg.clock_source ? (CLOCK_SOURCE_NAMES[cfg.clock_source] || cfg.clock_source) : 'Internal';
  document.getElementById('clockLabel').textContent = clockSet ? ('Clock: ' + srcName) : 'Clock';

  document.getElementById('opTune').textContent = 'Tune: ' + (yn(cfg.tune) === 'yes' ? 'On' : 'Off');

  renderTxHud();
  renderBeacon();
}

// Shared by both band dropdowns (Operate + Settings) -- one PUT, one code
// path, one fix. A single-field PUT rather than the full Settings form, so
// picking a band applies immediately and never touches any other field.
async function putConfigLine(line, busyMsg) {
  if (!MiniFT8Pairing.getToken()) {
    setMsg('Press the sidekick button to pair first.');
    MiniFT8Pairing.needsReauth();
    return;
  }
  setMsg(busyMsg);
  var r = await MiniFT8Pairing.authFetch('/api/config', {
    method: 'PUT',
    headers: { 'Content-Type': 'text/plain' },
    body: line
  });
  if (r.status == 401) {
    MiniFT8Pairing.needsReauth();
    setMsg('Press the sidekick button to pair');
    return;
  }
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok || j.ok === false) {
    setMsg((busyMsg.replace(/\.\.\.$/, '')) + ' failed: ' + (j.why || r.status));
    return;
  }
  setMsg(busyMsg.replace(/\.\.\.$/, '') + ' ok.');
  await loadConfig();
}

function changeBand(idx) {
  putConfigLine('band_sel=' + idx, 'Changing band…')
    .catch(function (e) { setMsg(String(e && e.message ? e.message : e)); });
}

async function loadConfig() {
  setMsg('Loading config from ADV…');
  var ac = new AbortController();
  var timer = setTimeout(function () { ac.abort(); }, 8000);
  try {
    var r = await fetch('/api/config', { signal: ac.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (!r.ok) throw new Error('config HTTP ' + r.status);
    var cfg = await r.json();
    if (cfg.ok === false) {
      throw new Error(cfg.why || 'config failed');
    }
    lastCfg = cfg;
    setForm(cfg);
    applyOperateLive(cfg);
    var n = 0;
    for (var k in cfg) { if (Object.prototype.hasOwnProperty.call(cfg, k)) n++; }
    if (n === 0) {
      setMsg('ADV returned empty config — is Port A linked?');
      return;
    }
    setMsg(MiniFT8Pairing.getToken()
      ? ('Loaded ' + n + ' fields from ADV — edit and save')
      : 'Loaded from ADV — press the sidekick button to pair before saving');
  } catch (e) {
    clearTimeout(timer);
    var msg = (e && e.name === 'AbortError')
      ? 'Config timed out — flash ADV with CONFIG support, check Port A'
      : String(e && e.message ? e.message : e);
    setMsg(msg);
    throw e;
  }
}

// Periodic, Operate-only refresh: live header fields alone, never the form.
async function pollLiveStatus() {
  try {
    var r = await fetch('/api/config', { cache: 'no-store' });
    if (!r.ok) return;
    var cfg = await r.json();
    if (cfg.ok === false) return;
    lastCfg = cfg;
    applyOperateLive(cfg);
  } catch (e) { /* next tick */ }
  // Gated internally (paired + backoff timer), so this is a no-op almost
  // every tick -- an actual sync attempt only every CLOCK_AUTO_SYNC_MS, or
  // every few seconds right after one that failed.
  autoSyncClock(false);
}

async function saveConfig() {
  if (!MiniFT8Pairing.getToken()) {
    setMsg('Press the sidekick button to pair first.');
    MiniFT8Pairing.needsReauth();
    return;
  }
  setMsg('Saving…');
  var r = await MiniFT8Pairing.authFetch('/api/config', {
    method: 'PUT',
    headers: { 'Content-Type': 'text/plain' },
    body: formBody()
  });
  if (r.status == 401) {
    MiniFT8Pairing.needsReauth();
    setMsg('Press the sidekick button to pair');
    return;
  }
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok || j.ok === false) {
    setMsg('Save failed: ' + (j.why || await r.text()));
    return;
  }
  setMsg('Saved.');
  await loadConfig();
}

// Clock sync is automatic (RFC 0004 §11: display it, don't make the
// operator hunt for a button). porta_host_set_clock() on the ADV already
// only acts when the clock is actually off by more than ~2s, so calling
// this on a cheap timer costs nothing when the clock is already right --
// same "always sync, only act when wrong" reasoning viewer.html's own
// sync() uses. Piggybacks on pollLiveStatus()'s existing 5s tick rather
// than a separate interval, so this adds no new steady-state WiFi traffic
// (see that function's own note on why extra polling matters here).
var clockSyncInFlight = false;
var clockNextSyncAfter = 0;
var CLOCK_AUTO_SYNC_MS = 180000; // re-check every 3 min: crystal drift, not urgency
var CLOCK_SOURCE_NAMES = { R: 'DS3231', G: 'GPS', P: 'Phone', W: 'Browser' };

async function autoSyncClock(manual) {
  if (!MiniFT8Pairing.getToken()) {
    if (manual) {
      setMsg('Press the sidekick button to pair first.');
      MiniFT8Pairing.needsReauth();
    }
    return;
  }
  if (clockSyncInFlight) return;
  if (!manual && Date.now() < clockNextSyncAfter) return;
  clockSyncInFlight = true;
  if (manual) setMsg('Syncing clock…');
  // Round-trip halving, the same reasoning NTP uses: set the host to the
  // time at the midpoint of the exchange, not when we started asking.
  var t0 = Date.now();
  try {
    var r = await MiniFT8Pairing.authFetch('/api/time', {
      method: 'POST',
      body: String(t0 + Math.round((Date.now() - t0) / 2))
    });
    if (r.status == 401) {
      MiniFT8Pairing.needsReauth();
      if (manual) setMsg('Press the sidekick button to pair');
      return;
    }
    var j = await r.json().catch(function () { return {}; });
    if (j.ok) {
      clockNextSyncAfter = Date.now() + CLOCK_AUTO_SYNC_MS;
      if (manual) setMsg('Clock synced.');
    } else {
      // Host still coming up, or PORTA not ready -- short backoff rather
      // than waiting a full CLOCK_AUTO_SYNC_MS to try again.
      clockNextSyncAfter = Date.now() + 3000;
      if (manual) setMsg('Clock: ' + (j.why || 'failed'));
    }
  } catch (e) {
    clockNextSyncAfter = Date.now() + 3000;
    if (manual) setMsg(String(e && e.message ? e.message : e));
  } finally {
    clockSyncInFlight = false;
  }
}

async function radioPost(path, body, busyMsg) {
  if (!MiniFT8Pairing.getToken()) {
    setMsg('Press the sidekick button to pair first.');
    MiniFT8Pairing.needsReauth();
    return;
  }
  setMsg(busyMsg);
  var opts = { method: 'POST' };
  if (body !== undefined) opts.body = body;
  var r = await MiniFT8Pairing.authFetch(path, opts);
  if (r.status == 401) {
    MiniFT8Pairing.needsReauth();
    setMsg('Press the sidekick button to pair');
    return;
  }
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok || j.ok === false) {
    setMsg((busyMsg.replace(/\.\.\.$/, '')) + ' failed: ' + (j.why || r.status));
    return;
  }
  setMsg(busyMsg.replace(/\.\.\.$/, '') + ' ok.');
  await loadConfig();
}

// ===================== Operate: countdown + parity (client clock, no wire dependency) =====================

var PROTO_PERIOD_MS = { FT8: 15000, FT4: 7500 };

function periodMs() {
  return PROTO_PERIOD_MS[(lastCfg.protocol_mode === 'FT4') ? 'FT4' : 'FT8'];
}

// The countdown only means something once slots are actually being decoded
// -- CAT ready and real audio flowing (see applyOperateLive()'s audio_rx
// note). Otherwise it just ticks off the phone's own clock against nothing.
function radioLive() {
  return yn(lastCfg.cat_ready) === 'yes' && yn(lastCfg.audio_rx) === 'yes';
}

function renderCountdown() {
  var pill = document.getElementById('parityPill');
  if (!radioLive()) {
    document.getElementById('countdown').textContent = '—';
    document.getElementById('slotSub').textContent = 'Connect radio + audio to see slot timing';
    pill.textContent = '—';
    return;
  }
  var p = periodMs();
  var now = Date.now();
  var intoSlot = now % p;
  var parity = Math.floor(now / p) % 2;
  var secsLeft = Math.ceil((p - intoSlot) / 1000);
  document.getElementById('countdown').textContent = secsLeft + 's';
  document.getElementById('slotSub').textContent = 'to TX · ' + (parity ? 'ODD' : 'EVEN') + ' slot';
  pill.textContent = parity ? 'ODD' : 'EVEN';
}
setInterval(renderCountdown, 250);

// ===================== Operate: beacon =====================

var slotState = null; // last SLOT_STATE event: {sp, bm, hz}

function renderBeacon() {
  var btn = document.getElementById('beaconBtn');
  var mode = slotState ? slotState.bm : 0;
  var cqName = CQ_TYPE_NAMES[parseInt(lastCfg.cq_type, 10)] || 'CQ';
  btn.textContent = (mode && mode > 0)
    ? ('Beacon: ' + cqName + ' · ' + BEACON_NAMES[mode] + ' (tap to change)')
    : 'Beacon: Off (tap to start)';
  // 0 means "nothing pending" (main.cpp's porta_queue_state_tick sends it
  // when g_pending_tx_valid is false) -- not a real offset, so it must not
  // pass a != null check the way it would.
  document.getElementById('opOffset').textContent =
    'TX: ' + (slotState && slotState.hz > 0 ? (slotState.hz + ' Hz') : '—');
}

document.getElementById('beaconBtn').onclick = function () {
  var next = ((slotState ? slotState.bm : 0) + 1) % 3;
  radioPost('/api/beacon', String(next), 'Beacon…')
    .catch(function (e) { setMsg(String(e && e.message ? e.message : e)); });
};

// ===================== Operate: TX HUD =====================
// Mirrors the on-device TX HUD banner (main.cpp's draw_tx_hud() / porta_tx_hud_tick()):
// same message/power/SWR/battery, one event per ~500 ms while transmitting,
// with a final active:false event the instant the banner would come down --
// no timeout to guess at on this side.

var txHud = null; // last TX_HUD event: {active, aborted, wrblk, pw, swr, batt, reason, x}

function renderTxHud() {
  var el = document.getElementById('opTxHud');
  if (!txHud || !txHud.active) {
    el.hidden = true;
    return;
  }
  el.hidden = false;
  el.classList.toggle('aborted', txHud.aborted);
  document.getElementById('opTxHudText').textContent = txHud.x || '(empty)';

  var parts = [];
  if (txHud.wrblk) {
    parts.push('WRITE BLOCKED');
  } else {
    if (txHud.pw > -1) parts.push((txHud.pw / 10).toFixed(1) + 'W');
    if (txHud.swr > -1) parts.push('SWR ' + (txHud.swr / 100).toFixed(2));
  }
  if (txHud.batt > -1) parts.push(txHud.batt + '% ' + (txHud.batt <= 20 ? '🪫' : '🔋'));
  // The reason string comes from the firmware's actual abort site
  // (porta_emit_tx_hud()'s `reason` field), not a guess here -- so a future
  // second abort cause shows up as itself instead of always reading
  // "low battery". Falls back to a generic label only if the firmware ever
  // sends aborted:true with no reason at all (should not happen).
  document.getElementById('opTxHudMeta').textContent = txHud.aborted
    ? ('TX ABORTED: ' + (txHud.reason || 'unknown reason'))
    : (parts.length ? parts.join(' · ') : '—');
}

// ===================== Operate: queue =====================

var queue = {}; // entry_id -> {dxcall, state, retry_count, retry_limit}

function renderQueue() {
  var ids = Object.keys(queue).sort(function (a, b) { return queue[b].state - queue[a].state; });
  var rows = document.getElementById('opQueueRows');
  document.getElementById('opQueueEmpty').hidden = ids.length > 0;
  rows.innerHTML = ids.map(function (id) {
    var q = queue[id];
    return '<div class=qrow>' +
      '<div><span class=call>' + esc(q.dxcall) + '</span>' +
      '<span class=retry>retry ' + q.retry_count + '/' + q.retry_limit + '</span></div>' +
      '<span class="qstate qs-' + q.state + '">' + esc(QUEUE_STATE_NAMES[q.state] || '?') + '</span>' +
      '<button type=button class=qcancel data-id="' + id + '">&times;</button>' +
      '</div>';
  }).join('');
  rows.querySelectorAll('.qcancel').forEach(function (b) {
    b.onclick = function () {
      radioPost('/api/queue/cancel', b.getAttribute('data-id'), 'Cancel…')
        .catch(function (e) { setMsg(String(e && e.message ? e.message : e)); });
    };
  });
}

// ===================== Operate: decode stream =====================

// Array of slot batches, newest first, each already decode_sort.h-ordered
// within itself. One batch per poll tick that carried new decodes -- see
// decodeSortGroup()'s comment -- capped to the last DECODE_SLOTS_MAX slots
// rather than a flat row count, so the operator reads slot-by-slot instead
// of an undifferentiated scroll.
var decodeSlots = [];
var DECODE_SLOTS_MAX = 3;

function fmtDt(dt) {
  return (dt > 0 ? '+' : '') + dt.toFixed(1);
}

// Mirrors main/decode_sort.h exactly (decode_sort_group/decode_sort_cmp):
// to_me first, then fresh CQ (strongest SNR first), then other fresh, then
// recent QSOs last. Applied per poll batch (one FT8 slot's worth of new
// decodes), not a global re-sort of the whole rolling history -- the
// firmware itself only ever sorts one slot's batch at a time.
function decodeSortGroup(d) {
  if (d.me) return 0;
  if (d.rq) return 3;
  if (d.cq) return 1;
  return 2;
}
function decodeSortCmp(a, b) {
  var ga = decodeSortGroup(a), gb = decodeSortGroup(b);
  if (ga !== gb) return ga - gb;
  if (ga === 1 && a.snr !== b.snr) return b.snr - a.snr;
  return 0;
}

// Mirrors ui.cpp's draw_rx_line() color precedence: to_me, else recent_qso,
// else cq, else default.
function decodeColorClass(d) {
  if (d.me) return 'c-me';
  if (d.rq) return 'c-recent';
  if (d.cq) return 'c-cq';
  return '';
}

function renderDecodes() {
  var rows = document.getElementById('opDecodeRows');
  rows.innerHTML = decodeSlots.map(function (slot, i) {
    var divider = i > 0 ? '<div class=dslotdiv></div>' : '';
    return divider + slot.map(function (d) {
      return '<div class=drow data-id="' + d.id + '">' +
        '<div class=meta><span>DT ' + fmtDt(d.dt) + '</span><span>' + d.hz + ' Hz</span><span>' +
        (d.snr > 0 ? '+' : '') + d.snr + ' dB</span></div>' +
        '<div class="txt ' + decodeColorClass(d) + '">' + esc(d.x) +
        (d.me ? '<span class=me>&rarr; ME</span>' : '') + '</div>' +
        '</div>';
    }).join('');
  }).join('');
  rows.querySelectorAll('.drow').forEach(function (el) {
    el.onclick = function () {
      radioPost('/api/queue/reply', el.getAttribute('data-id'), 'Queueing…')
        .catch(function (e) { setMsg(String(e && e.message ? e.message : e)); });
    };
  });
}

// ===================== Operate: event poll =====================
// Same polled /api/events?since= shape as /log's viewer (RFC 0004 §6):
// a poll cannot wedge the server the way a long-lived stream could.

var evSeq = 0;
var pendingDecodes = []; // scratch: this poll's new decodes, sorted then merged in

function applyEvent(e) {
  if (e.d === 1) {
    pendingDecodes.push({ id: e.id, dt: e.dt, hz: e.hz, snr: e.snr, x: e.x,
                          me: !!e.me, cq: !!e.cq, rq: !!e.rq });
  } else if (e.d === 2) {
    if (e.st === 6) {
      delete queue[e.eid]; // IDLE is the removal signal (RFC 0004 §11)
    } else {
      queue[e.eid] = { dxcall: e.x, state: e.st, retry_count: e.rc, retry_limit: e.rl };
    }
  } else if (e.d === 3) {
    slotState = { sp: e.sp, bm: e.bm, hz: e.hz };
  } else if (e.d === 4) {
    txHud = { active: !!e.active, aborted: !!e.aborted, wrblk: !!e.wrblk,
             pw: e.pw, swr: e.swr, batt: e.batt, reason: e.reason || '', x: e.x };
  }
}

async function pollEvents() {
  try {
    var r = await fetch('/api/events?since=' + evSeq, { cache: 'no-store' });
    var j = await r.json();
    if (j.events && j.events.length) {
      pendingDecodes = [];
      j.events.forEach(applyEvent);
      if (pendingDecodes.length) {
        pendingDecodes.sort(decodeSortCmp);
        decodeSlots.unshift(pendingDecodes);
        if (decodeSlots.length > DECODE_SLOTS_MAX) decodeSlots.length = DECODE_SLOTS_MAX;
      }
      renderQueue();
      renderDecodes();
      renderBeacon();
      renderTxHud();
    }
    evSeq = j.seq;
  } catch (e) { /* next tick */ }
}

// ===================== Log =====================
// One continuous list of QSOs spanning every day file (RFC 0004 §11): day
// dividers, lazy-loaded, file boundaries invisible to the operator. Built
// entirely on the existing per-file /api/log/files and /api/log/entries
// endpoints -- loadMoreLog() walks day files in order and stitches their
// entries into one scroll, fetching another file's worth whenever the
// current one runs out.

var logLoadedOnce = false;
var logFiles = [];           // known day filenames, newest first
var logFilesSkip = 0;        // pagination cursor into the file listing itself
var logFilesExhausted = false;
var logFileIdx = 0;          // logFiles[] index of the file loadMoreLog() is draining
var logFileLoadedCount = {}; // filename -> rows already loaded for it, persists across
                             // logFileIdx moving on -- refreshLogHead() below needs to
                             // keep polling today's file (logFiles[0]) for new QSOs
                             // appended after we've moved on to older days
var logGroupEls = {};        // filename -> its <div class=daygroup> DOM container, so
                             // appending new rows to a file lands in that file's own
                             // section regardless of what's been loaded after it
var logDone = false;         // every file drained, nothing left anywhere
var logLoading = false;
var logRefreshing = false;
var logRenderedAny = false;

var LOG_ENTRY_FETCH = 10;    // rows per /api/log/entries call
var LOG_ENTRY_GOAL = 15;     // rows to append per loadMoreLog() batch
var LOG_REFRESH_MS = 8000;   // how often to check today's file for new QSOs while the
                             // Log tab is open -- a QSO just logged should show up
                             // without a page reload, but this stays modest given this
                             // session's earlier finding about steady polling and WiFi

function dayLabel(name) {
  // name is "YYYYMMDD.adi" (qso_browse.cpp / file_list.cpp). Today gets a
  // friendlier label; anything else reads as-is -- no client-side date math
  // worth the edge cases for a first pass.
  var y = name.slice(0, 4), mo = name.slice(4, 6), d = name.slice(6, 8);
  var today = new Date();
  var todayStr = today.getUTCFullYear() + String(today.getUTCMonth() + 1).padStart(2, '0') +
                String(today.getUTCDate()).padStart(2, '0');
  return (name.slice(0, 8) === todayStr) ? 'Today' : (mo + '-' + d + '-' + y);
}

function fmtRst(v) {
  return (v === -99 || v == null) ? '—' : (v > 0 ? '+' + v : String(v));
}

// Appends to `file`'s own persistent container rather than the end of
// #logList, so a later call for a file that already has rows (either
// loadMoreLog() continuing to page through it, or refreshLogHead() finding
// new QSOs logged since) lands them in the right place regardless of what
// has been appended after it in the meantime.
function appendLogRows(file, rows, prependGroup) {
  var list = document.getElementById('logList');
  if (!logRenderedAny) list.innerHTML = ''; // clear the "Loading…" placeholder
  var group = logGroupEls[file];
  if (!group) {
    group = document.createElement('div');
    group.className = 'daygroup';
    var day = document.createElement('div');
    day.className = 'day';
    day.textContent = dayLabel(file);
    group.appendChild(day);
    // loadMoreLog() walks files oldest-of-what's-known-so-far last, so a
    // plain append keeps newest-first order there. checkForNewDayFiles()
    // below discovers a file *newer* than anything rendered yet, which has
    // to land above the existing groups instead.
    if (prependGroup && list.firstChild) {
      list.insertBefore(group, list.firstChild);
    } else {
      list.appendChild(group);
    }
    logGroupEls[file] = group;
  }
  rows.forEach(function (q) {
    var row = document.createElement('div');
    row.className = 'frow';
    row.innerHTML =
      '<div class=frow-main>' +
        '<div><span class=call>' + esc(q.call) + '</span>' +
        (q.grid ? '<span class=grid>' + esc(q.grid) + '</span>' : '') + '</div>' +
        '<span class=sub>' + esc(q.time) + ' · ' + esc(q.band) +
        (q.freq ? ' · ' + esc(q.freq) + ' MHz' : '') + ' · ' +
        fmtRst(q.rst_sent) + '/' + fmtRst(q.rst_rcvd) + '</span>' +
      '</div>' +
      ((q.my_grid || q.comment) ?
        '<div class=frow-extra>' +
          (q.my_grid ? '<span class=degrid>DE ' + esc(q.my_grid) + '</span>' : '') +
          (q.comment ? '<span class=comment>' + esc(q.comment) + '</span>' : '') +
        '</div>' : '');
    group.appendChild(row);
    logRenderedAny = true;
  });
}

// Fetches the next page of day filenames the first time (or another page
// once logFileIdx runs off the end of what's been fetched so far). A no-op
// once every file the ADV has is known.
async function ensureLogFiles() {
  if (logFileIdx < logFiles.length || logFilesExhausted) return;
  var r = await fetch('/api/log/files?skip=' + logFilesSkip + '&take=30', { cache: 'no-store' });
  var j = await r.json();
  if (!j.ok) throw new Error(j.why || 'file list failed');
  var files = j.files || [];
  logFiles = logFiles.concat(files);
  logFilesSkip += files.length;
  if (files.length < 30) logFilesExhausted = true;
}

async function loadMoreLog() {
  if (logLoading || logDone) return;
  logLoading = true;
  document.getElementById('logMoreBtn').disabled = true;
  var appended = 0;
  try {
    while (appended < LOG_ENTRY_GOAL) {
      await ensureLogFiles();
      if (logFileIdx >= logFiles.length) { logDone = true; break; }
      var file = logFiles[logFileIdx];
      var skip = logFileLoadedCount[file] || 0;
      var r = await fetch('/api/log/entries?file=' + encodeURIComponent(file) +
                          '&skip=' + skip + '&take=' + LOG_ENTRY_FETCH, { cache: 'no-store' });
      var j = await r.json();
      if (!j.ok) throw new Error(j.why || 'entries failed');
      var rows = j.entries || [];
      if (rows.length) {
        appendLogRows(file, rows);
        appended += rows.length;
        logFileLoadedCount[file] = skip + rows.length;
      }
      if (rows.length < LOG_ENTRY_FETCH) {
        // This file is exhausted for now -- move on to the next one.
        logFileIdx++;
      }
    }
  } catch (e) {
    if (!logRenderedAny) {
      document.getElementById('logList').innerHTML =
        '<p style="padding:0 1rem;color:GrayText">no reply from sidekick</p>';
    }
  } finally {
    logLoading = false;
    if (logDone && !logRenderedAny) {
      document.getElementById('logList').innerHTML =
        '<p style="padding:0 1rem;color:GrayText">No QSOs</p>';
    }
    document.getElementById('logMore').hidden = logDone;
    document.getElementById('logMoreBtn').disabled = false;
  }
}
document.getElementById('logMoreBtn').onclick = function () { loadMoreLog(); };

// ensureLogFiles() only ever looks *past* the end of what it has fetched
// (older files); a file newer than logFiles[0] -- the ADV's day rollover at
// UTC midnight -- is otherwise never noticed short of a page reload, since
// nothing else re-checks the front of the listing. Prepends any such file(s)
// in newest-first order, ahead of everything already rendered, then leaves
// logFiles[0] pointing at the true latest file so refreshLogHead() below
// polls the right one.
async function checkForNewDayFiles() {
  if (!logFiles.length) return;
  var r = await fetch('/api/log/files?skip=0&take=5', { cache: 'no-store' });
  var j = await r.json();
  if (!j.ok) return;
  var files = j.files || [];
  var known = logFiles[0];
  var fresh = [];
  for (var i = 0; i < files.length; i++) {
    if (files[i] === known) break; // caught up to what we already know
    fresh.push(files[i]);
  }
  if (!fresh.length) return;
  for (var k = fresh.length - 1; k >= 0; k--) {
    logFiles.unshift(fresh[k]);
    appendLogRows(fresh[k], [], true);
  }
  logFileIdx += fresh.length;
  logFilesSkip += fresh.length;
}

// Today's file (logFiles[0]) is the only one still growing -- a QSO logged
// while the tab is open lands at its end. Re-checks it on a timer, only
// while the Log tab is actually visible, and only picks up rows beyond
// what's already loaded (so this also backfills today's file if the
// operator never paged all the way through it via "Load older QSOs").
// checkForNewDayFiles() runs first so a midnight rollover mid-session
// retargets logFiles[0] before this fetches its entries.
async function refreshLogHead() {
  if (!logLoadedOnce || logLoading || logRefreshing) return;
  if (currentView !== 'log') return;
  if (!logFiles.length) return; // first loadMoreLog() hasn't run yet
  logRefreshing = true;
  try {
    await checkForNewDayFiles();
    var file = logFiles[0];
    var skip = logFileLoadedCount[file] || 0;
    var r = await fetch('/api/log/entries?file=' + encodeURIComponent(file) +
                        '&skip=' + skip + '&take=' + LOG_ENTRY_FETCH, { cache: 'no-store' });
    var j = await r.json();
    if (!j.ok) return;
    var rows = j.entries || [];
    if (rows.length) {
      appendLogRows(file, rows);
      logFileLoadedCount[file] = skip + rows.length;
    }
  } catch (e) { /* next tick */ } finally {
    logRefreshing = false;
  }
}
setInterval(refreshLogHead, LOG_REFRESH_MS);

  status: m,
  onPaired: function () {
    enableWrites(true);
    setMsg('Paired — edit and save');
    autoSyncClock(false);
  }
});
if (MiniFT8Pairing.getToken()) {
  enableWrites(true);
  autoSyncClock(false);
}

loadConfig().catch(function () { /* setMsg already */ });
renderCountdown();
renderBeacon();
renderQueue();
renderDecodes();
renderTxHud();

function tick() {
  pollEvents();
  setTimeout(tick, 1000);
}
tick();

// CAT/audio/band/offset don't need 1 Hz freshness the way decodes do, and
// every extra request is extra WiFi traffic -- found 2026-09-14, sustained
// 2 Hz polling (this plus pollEvents, both at 1000ms) correlated with
// steady WiFi block-ack renegotiation and a CCMP replay error on the
// operator's router. 5s is still comfortably live for a status line, and
// halves steady-state request volume on its own even before considering
// that pollEvents is genuinely useful at 1 Hz (viewer.html already polls
// /api/events that often) while this one was just riding along at the same
// rate for no real reason.
setInterval(pollLiveStatus, 5000);
pollLiveStatus();
</script>
