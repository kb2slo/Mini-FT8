# Production firmware + host tests.
# Merged image is the same POST_BUILD output as a local `idf.py build`:
#   build/MiniFT8_Merged_Auto.bin  — flash at 0x0 (8 MB, custom partitions).
#
# Firmware + the rolling `dev` release run only when sources that can change
# the binary (or this workflow) change. Docs/roadmap-only commits skip them.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            firmware:
              - 'main/**'
              - 'components/**'
              - 'sidekick/**'
              - 'CMakeLists.txt'
              - 'sdkconfig'
              - 'sdkconfig.defaults'
              - 'partitions.csv'
              - 'dependencies.lock'
              - '**/idf_component.yml'
              - 'tools/**/*.cmake'
              - '.github/workflows/ci.yml'

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Autoseq host_mock
        working-directory: host_mock
        run: |
          make -j"$(nproc)"
          failed=0
          for f in test_*.json; do
            echo "===== $f ====="
            ./host_test "$f" || failed=1
          done
          echo "===== host_test_unique_callsign ====="
          ./host_test_unique_callsign || failed=1
          echo "===== host_test_beacon_cancel ====="
          ./host_test_beacon_cancel || failed=1
          echo "===== host_test_adif_merge ====="
          ./host_test_adif_merge || failed=1
          echo "===== host_test_copy_block ====="
          ./host_test_copy_block || failed=1
          echo "===== host_test_station_save_queue ====="
          ./host_test_station_save_queue || failed=1
          echo "===== host_test_file_list ====="
          ./host_test_file_list || failed=1
          echo "===== host_test_radio_profile ====="
          ./host_test_radio_profile || failed=1
          echo "===== host_test_tx_hud_banner ====="
          ./host_test_tx_hud_banner || failed=1
          echo "===== host_test_rx_list_stale ====="
          ./host_test_rx_list_stale || failed=1
          echo "===== host_test_cts_time ====="
          ./host_test_cts_time || failed=1
          echo "===== host_test_band_config ====="
          ./host_test_band_config || failed=1
          echo "===== host_test_usb_c_presence ====="
          ./host_test_usb_c_presence || failed=1
          exit "$failed"

      - name: TX e2e (CTest)
        working-directory: tests/tx_e2e
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

  nano-firmware:
    name: Sidekick (ESP32-C6)
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    env:
      # Same pin the ADV firmware job uses, and for the same reason: CI
      # checks out a synthesized merge commit for a PR, not
      # github.event.pull_request.head.sha, so a bare `git rev-parse HEAD`
      # in sidekick/CMakeLists.txt would disagree with the ADV's pinned
      # version — defeating the exact-match comparison RFC 0001 §5.2c
      # relies on. Must match the firmware job's value exactly.
      MINIFT8_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build sidekick with ESP-IDF 5.5.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          path: sidekick
          extra_docker_args: -e MINIFT8_GIT_SHA=${{ env.MINIFT8_GIT_SHA }}
          command: idf.py build

      - name: Stage sidekick outputs
        run: |
          mkdir -p stage
          cp sidekick/build/bootloader/bootloader.bin stage/bootloader.bin
          cp sidekick/build/partition_table/partition-table.bin stage/partition-table.bin
          cp sidekick/build/sidekick.bin stage/sidekick.bin

      - name: Upload sidekick firmware
        uses: actions/upload-artifact@v6
        with:
          name: sidekick-firmware
          if-no-files-found: error
          retention-days: 30
          path: stage/

  firmware:
    name: Firmware (ESP32-S3)
    needs: [changes, nano-firmware]
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MINIFT8_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download sidekick firmware
        uses: actions/download-artifact@v7
        with:
          name: sidekick-firmware
          path: components/nano_flasher/target_firmware

      - name: Verify sidekick firmware staged
        run: |
          for f in bootloader.bin partition-table.bin sidekick.bin; do
            test -s "components/nano_flasher/target_firmware/${f}" || {
              echo "::error::missing or empty components/nano_flasher/target_firmware/${f} — the published ADV image would silently ship without Nano field-flash support"
              exit 1
            }
          done

      - name: Build with ESP-IDF 5.5.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          extra_docker_args: -e MINIFT8_GIT_SHA=${{ env.MINIFT8_GIT_SHA }}
          command: idf.py build

      - name: Stage hash-first merged image
        run: |
          mkdir -p dist
          name="$(tr -d '[:space:]' < build/generated/merged_bin_name.txt)"
          test -n "$name"
          test -f "build/${name}"
          cp "build/${name}" "dist/${name}"
          sha256sum "dist/${name}" | tee "dist/${name}.sha256"
          {
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "head=${MINIFT8_GIT_SHA:0:7}"
            echo "idf=v5.5.1"
            echo "target=esp32s3"
            echo "bin=${name}"
            echo "sidekick_fw=embedded"
            echo "flash=esptool.py --chip esp32s3 write_flash 0x0 ${name}"
          } > dist/BUILD.txt
          echo "BIN_FILE=${name}" >> "$GITHUB_ENV"

      - name: Upload merged binary
        id: bin
        uses: actions/upload-artifact@v6
        with:
          name: MiniFT8-Cardputer-ADV
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/${{ env.BIN_FILE }}
            dist/${{ env.BIN_FILE }}.sha256
            dist/BUILD.txt

      - name: Job summary
        run: |
          {
            echo "## Firmware artifact"
            echo
            echo "- Image: \`${BIN_FILE}\`"
            echo "- [MiniFT8-Cardputer-ADV](${{ steps.bin.outputs.artifact-url }})"
            echo "- [This run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo '```'
            echo "esptool.py --chip esp32s3 write_flash 0x0 ${BIN_FILE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.bin.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BIN_FILE: ${{ env.BIN_FILE }}
        with:
          script: |
            const marker = '<!-- minift8-ci-firmware -->';
            const sha = process.env.HEAD_SHA;
            const short = sha.slice(0, 7);
            const bin = process.env.BIN_FILE;
            const artifactUrl = process.env.ARTIFACT_URL;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const commitUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/commit/${sha}`;
            const body = [
              marker,
              '## Firmware (Cardputer ADV)',
              '',
              'Latest CI image for this PR (this comment is replaced on each push).',
              '',
              `- Commit: [\`${short}\`](${commitUrl})`,
              `- File: \`${bin}\` (hash first, for M5Launcher)`,
              `- Download: [MiniFT8-Cardputer-ADV](${artifactUrl})`,
              `- [Workflow run](${runUrl})`,
              '',
              '```',
              `esptool.py --chip esp32s3 write_flash 0x0 ${bin}`,
              '```',
              '',
              'First boot may format FATFS. Artifact expires in 30 days.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release:
    name: GitHub Release (tag)
    needs: [host-tests, firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MiniFT8-Cardputer-ADV
          path: dist

      - name: Name tagged binaries
        run: |
          tag="${GITHUB_REF_NAME}"
          bin="$(awk -F= '/^bin=/{print $2}' dist/BUILD.txt)"
          test -n "$bin"
          test -f "dist/${bin}"
          cp "dist/${bin}" "dist/MiniFT8-${tag}-Merged.bin"
          sha256sum "dist/MiniFT8-${tag}-Merged.bin" | tee "dist/MiniFT8-${tag}-Merged.bin.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/MiniFT8-${{ github.ref_name }}-Merged.bin
            dist/MiniFT8-${{ github.ref_name }}-Merged.bin.sha256
          body: |
            Flash the merged image at `0x0` (full 8 MB image, custom FATFS partition table).

            ```
            esptool.py --chip esp32s3 write_flash 0x0 MiniFT8-${{ github.ref_name }}-Merged.bin
            ```

            First boot may format the FATFS partition.

  release-main:
    name: GitHub Release (main)
    needs: [host-tests, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MiniFT8-Cardputer-ADV
          path: dist

      - name: Name rolling main binary
        run: |
          bin="$(awk -F= '/^bin=/{print $2}' dist/BUILD.txt)"
          test -n "$bin"
          test -f "dist/${bin}"
          cp "dist/${bin}" dist/minift8-dev.bin
          sha256sum dist/minift8-dev.bin | tee dist/minift8-dev.bin.sha256
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "HASH_BIN=${bin}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Mini-FT8 dev (${{ env.SHORT_SHA }})
          prerelease: true
          make_latest: false
          files: |
            dist/minift8-dev.bin
            dist/minift8-dev.bin.sha256
            dist/BUILD.txt
          body: |
            Rolling firmware from `main` (updated on each merge). Not a versioned product tag.

            - Commit: `${{ github.sha }}`
            - Build image: `${{ env.HASH_BIN }}`
            - Download: `minift8-dev.bin`

            Flash at `0x0` (full 8 MB image, custom FATFS partition table).

            ```
            esptool.py --chip esp32s3 write_flash 0x0 minift8-dev.bin
            ```

            First boot may format the FATFS partition.
