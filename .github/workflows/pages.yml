# GitHub Pages: human landing + machine bundle under webapp/ (RFC 0004 §4).
# Path-filtered so firmware-only commits do not redeploy the site.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify manifest matches assets
        run: python3 webapp/tools/gen_manifest.py --check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
