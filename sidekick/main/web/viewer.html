<!doctype html>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>Mini-FT8 host log</title>

<!--
  The host log and decode stream, served at /log.

  Two details that matter and are easy to miss. `overflow-anchor: none` stops
  the browser's own scroll anchoring from fighting the same job and producing
  a jitter neither mechanism intends. And trimming old rows happens only while
  following: removing from the top while someone is reading history shifts
  everything under their eyes.

  An unset host clock renders as --:--:-- rather than as a 1970 timestamp or a
  blank. FT8 will not decode without a synced clock, so "the host does not
  know what time it is" is diagnostic information, not an absence. A fresh
  event with t=0 after we had already synced means the ADV rebooted and lost
  time — clear the synced flag so the next poll offers the browser clock again
  without a page reload.

  Pairing is shared: /pairing.js polls for a button press and stores the token.
  Setting the clock is a write, so it waits on that; watching does not.
-->

<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:ui-monospace,monospace;background:#111;color:#ddd;font-size:13px}
#s{flex:none;color:#888;font-size:11px;padding:.35rem .5rem;border-bottom:1px solid #222}
#o{flex:1;overflow-y:auto;overflow-anchor:none;padding:.25rem .5rem}
div.r{padding:.1rem 0;white-space:pre-wrap;word-break:break-word}
.ts{color:#555}
.cq{color:#7fd}
.me{color:#fd7}
.lg{color:#999}
</style>

<div id=s>connecting…</div>
<div id=o></div>

<script src=/pairing.js></script>
<script>
let q = 0, o = document.getElementById('o'), s = document.getElementById('s'), follow = true;

function atBottom() { return o.scrollHeight - o.scrollTop - o.clientHeight < 40 }

function stat() {
  s.textContent = follow ? ('live · ' + q + ' events')
                         : ('paused · scroll to the bottom to follow · ' + q + ' events')
}
o.addEventListener('scroll', function () { follow = atBottom(); stat() });

function hhmmss(t) {
  if (!t) return '--:--:--';
  return new Date(t * 1000).toISOString().substr(11, 8)
}

function row(e) {
  var d = document.createElement('div'); d.className = 'r';
  var a = document.createElement('span'); a.className = 'ts'; a.textContent = hhmmss(e.t) + ' ';
  var b = document.createElement('span');
  if (e.d) {
    b.textContent = ((e.snr > 0 ? '+' : '') + e.snr).padStart(3) + ' '
                  + String(e.hz).padStart(4) + ' '
                  + (e.dt > 0 ? '+' : '') + e.dt.toFixed(1) + ' ' + e.x;
    b.className = e.me ? 'me' : (e.cq ? 'cq' : '')
  } else {
    b.textContent = '· ' + e.x; b.className = 'lg'
  }
  d.appendChild(a); d.appendChild(b); return d
}

var synced = false;
var syncInFlight = false;
var nextSyncAfter = 0;

async function sync() {
  if (synced || syncInFlight) return;
  if (!MiniFT8Pairing.getToken()) return;
  if (Date.now() < nextSyncAfter) return;
  syncInFlight = true;
  // Round-trip halving, the same reasoning NTP uses: the host should be set to
  // the time at the midpoint of the exchange, not the time we started it. Over
  // WiFi this is tens of milliseconds against FT8's one-second tolerance, so
  // it is belt and braces rather than necessity.
  var t0 = Date.now();
  try {
    var r = await MiniFT8Pairing.authFetch('/api/time', {
      method: 'POST',
      body: String(t0 + Math.round((Date.now() - t0) / 2))
    });
    if (r.status == 401) {
      synced = false;
      MiniFT8Pairing.needsReauth();
      return
    }
    var j = await r.json();
    if (!j.ok) {
      // Host still coming up after a reboot, or PORTA not ready — retry with
      // a short backoff rather than locking synced and waiting for a refresh.
      synced = false;
      nextSyncAfter = Date.now() + 3000;
      s.textContent = 'clock not set: ' + j.why;
    } else {
      synced = true;
      nextSyncAfter = 0;
      stat();
    }
  } catch (e) {
    synced = false;
    nextSyncAfter = Date.now() + 3000;
  } finally {
    syncInFlight = false;
  }
}

MiniFT8Pairing.boot({
  status: s,
  onPaired: function () { synced = false; nextSyncAfter = 0; sync() }
});

async function tick() {
  try {
    var r = await fetch('/api/events?since=' + q), j = await r.json();
    var sawUnset = false;
    if (j.events.length) {
      var was = atBottom();
      for (var i = 0; i < j.events.length; i++) {
        if (!j.events[i].t) sawUnset = true;
        o.appendChild(row(j.events[i]));
      }
      if (was) { o.scrollTop = o.scrollHeight; follow = true }
      if (follow) { while (o.childNodes.length > 300) o.removeChild(o.firstChild) }
    }
    q = j.seq;
    // A new event with no timestamp means the host clock is unset — typically
    // an ADV reboot. Drop the one-shot sync latch so we offer time again.
    // Leave nextSyncAfter alone: after a failed offer (host still booting) the
    // backoff must stand, or a stream of t=0 events would POST every second.
    if (sawUnset) synced = false;
    // Do not overwrite a pairing prompt or a clock-error line with "live".
    if (MiniFT8Pairing.getToken() && s.textContent.indexOf('Press the sidekick') < 0 &&
        s.textContent.indexOf('clock not set') < 0) {
      stat();
    }
    sync()
  } catch (e) { s.textContent = 'disconnected — retrying' }
  setTimeout(tick, 1000)
}
tick();
</script>
