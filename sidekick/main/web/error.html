<!--
  Our own error page rather than httpd_resp_send_err(), which hardcodes
  Content-Type: text/html with no charset -- the Latin-1 guess that mangled
  these pages before -- and is not overridable, because it sets the type after
  the handler has run. Error strings are the easiest place for that to go
  unnoticed: written once, seen rarely, and exactly where a non-ASCII
  character ends up when the text has something to explain.
-->
