## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  lvgl/lvgl: ^8.3.9
  # USB Host UAC for audio streaming. Pinned exact for the same reason as
  # usb_host_cdc_acm below: moving storage_service's manifest into this file
  # (RFC 0002 §5.1) re-resolves every range here, and these two drifted on the
  # first cascade build — usb_host_uac 1.3.3 -> 1.5.0, usb 1.1.0 -> 1.4.1.
  # Both are on the QMX UAC audio path, which RFC 0002 §2.5 requires stay
  # unchanged and which only a field session can check. These are the versions
  # the lock already held; bump them deliberately, not by moving a file.
  espressif/usb_host_uac: 1.3.3
  espressif/usb: 1.1.0
  # USB Host CDC for CAT. Pinned exact: nano_flasher's esp-serial-flasher
  # dependency also wants usb_host_cdc_acm and a fresh component-manager
  # resolve otherwise silently bumps this to the newest 2.x on the QMX CAT
  # path (I3 pivot, 2026-09-03). Bump deliberately, with a QMX field check —
  # not as a side effect of an unrelated dependency add.
  espressif/usb_host_cdc_acm: 2.2.0
  # Cardputer-Adv ES8311 mic capture. Pinned exact — drifted 1.5.9 -> 1.6.2 on
  # the same re-resolve; mic capture is a field-only path.
  espressif/esp_codec_dev: 1.5.9
  # NOT the USB Drive gadget -- that was removed in B23. This is still
  # required because storage_service mounts the *internal* FATFS through
  # esp_tinyusb's MSC storage API (tinyusb_msc_install_driver +
  # tinyusb_msc_new_storage_spiflash), which is how /storage is mounted for
  # the firmware's own log writes. Do not delete this thinking it is dead:
  # removing it means re-implementing that mount on plain esp_vfs_fat + wl_*,
  # which B23 measured as worth ~3.4 KB flash and 16 B DIRAM -- not worth
  # touching the path that holds the QSO logs. The USB *device* stack is
  # already gone: with nothing calling tinyusb_driver_install(), the linker
  # garbage-collects libespressif__tinyusb.a entirely.
  # Pinned exact for the same reason as the entries above -- a manifest edit
  # re-resolves every range here, and this drifted 2.1.1 -> 2.2.1 once already.
  espressif/esp_tinyusb: 2.1.1
